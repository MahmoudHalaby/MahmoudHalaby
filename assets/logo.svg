<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-label="Mahmoud Halaby">
  <title>Mahmoud Halaby — Software QA Engineer &amp; Security Tester</title>
  <desc>Minimal typographic logo.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- monogram -->
  <text x="0" y="78" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="800" fill="#f0f6fc" letter-spacing="-4">MH</text>
  <rect x="2" y="96" width="78" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- divider -->
  <line x1="112" y1="20" x2="112" y2="118" stroke="#30363d" stroke-width="1"/>

  <!-- wordmark -->
  <text x="140" y="66" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Mahmoud Halaby</text>
  <text x="142" y="96" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#8b949e" letter-spacing="1.8">SOFTWARE QA ENGINEER  ·  SECURITY TESTER</text>
</svg>
