<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-label="Mahmoud Halaby logo">
  <title>Mahmoud Halaby</title>
  <desc>Software QA and security tester — shield, target, magnifier, and agentic bug-bounty glyph.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- shield -->
  <path d="M75 16 L118 33 V70 C118 99 98 119 75 127 C52 119 32 99 32 70 V33 Z"
        fill="#0b1120" stroke="url(#accent)" stroke-width="3"/>
  <!-- target rings -->
  <circle cx="75" cy="71" r="30" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity="0.55"/>
  <circle cx="75" cy="71" r="18" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity="0.75"/>
  <circle cx="75" cy="71" r="6" fill="#22d3ee"/>
  <!-- crosshair ticks -->
  <path d="M75 33 V46 M75 96 V109 M37 71 H50 M100 71 H113" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
  <!-- magnifier + lightning (QA + security) -->
  <circle cx="75" cy="71" r="40" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <path d="M84 44 L60 76 H75 L68 104 L96 66 H80 Z" fill="url(#accent)" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="145" y="74" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="-1">Mahmoud Halaby</text>
  <text x="147" y="100" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#8b949e" letter-spacing="2.5">SOFTWARE QA  ·  SECURITY TESTING  ·  AGENTIC BUG BOUNTY</text>
</svg>
