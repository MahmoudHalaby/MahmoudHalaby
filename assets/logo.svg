<svg xmlns="http://www.w3.org/2000/svg" width="660" height="120" viewBox="0 0 660 120" role="img" aria-label="Mahmoud Halaby — QA Engineer &amp; Security Tester">
  <title>Mahmoud Halaby</title>
  <desc>Software QA engineer and security tester.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- own background card: works in GitHub light AND dark mode -->
  <rect x="1" y="1" width="658" height="118" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- shield + check icon -->
  <path d="M44 22 L72 32 V60 C72 76 60 88 44 94 C28 88 16 76 16 60 V32 Z"
        fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M32 58 L41 67 L56 48" fill="none" stroke="url(#accent)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark (light text on own dark card) -->
  <text x="98" y="60" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="750" fill="#f0f6fc" letter-spacing="-1">Mahmoud Halaby</text>
  <text x="100" y="86" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="600" fill="#9aa7b4" letter-spacing="1.3">QA ENGINEER  ·  SECURITY TESTER  ·  AGENTIC BUG BOUNTY</text>
</svg>
